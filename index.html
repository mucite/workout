<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recomp · Phase 1</title>
<meta name="description" content="3-day strength split plus Zone 2 cardio, rest timer, whole-food meal plan and shopping list.">
<meta name="theme-color" content="#ECEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1419" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --sunk:#EEF1F5; --ink:#141B24; --muted:#5F6B79; --line:#E3E8EE;
  --red:#C8102E; --blue:#1D4E9E; --yellow:#E8B10A; --green:#1F7A4D; --grey:#8A939D;
  --accent:var(--blue); --on-accent:#fff;
  --shadow:0 1px 2px rgba(20,27,36,.06),0 6px 20px rgba(20,27,36,.06);
  --r:16px; --r-sm:10px;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0F1419;--surface:#182029;--sunk:#121920;--ink:#E9EEF3;--muted:#8C99A6;--line:#26303B;--grey:#5E6873;--shadow:none}
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 140px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.05;margin:0;letter-spacing:.01em}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}

/* Header + week strip */
.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 4px}
.brand h1{font-size:1.25rem;letter-spacing:.02em}
.brand span{font-size:.85rem;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:6px 0 10px}
.day{background:none;border:0;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:12px}
.plate{--pc:var(--grey);width:34px;height:34px;border-radius:50%;position:relative;
  background:radial-gradient(circle,var(--bg) 0 17%,#B9C0C8 18% 25%,var(--pc) 26% 88%,color-mix(in srgb,var(--pc) 70%,#000) 89% 100%);
  transition:transform .2s ease,box-shadow .2s ease}
.plate.done::after{content:"";position:absolute;inset:0;margin:auto;width:8px;height:8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 2px var(--bg)}
.day[aria-pressed="true"] .plate{transform:scale(1.12);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--pc)}
.day small{font-size:.75rem;color:var(--muted);line-height:1.15;text-align:center}
.day[aria-pressed="true"] small{color:var(--ink);font-weight:600}
.day .today{display:block;font-size:.65rem;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.04em}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabbar .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;max-width:360px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.12);pointer-events:auto}
.tab{background:none;border:0;padding:10px 0;border-radius:999px;font-family:var(--display);font-size:1.05rem;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* Hero */
.hero{padding:20px 0 4px}
.hero .kicker{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.hero h2{font-size:clamp(2rem,7vw,2.6rem);margin:4px 0 6px}
.hero h2 .bar{display:inline-block;width:.3em;height:.7em;background:var(--accent);margin-right:.2em;border-radius:2px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.92rem;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.progress{height:6px;background:color-mix(in srgb,var(--ink) 9%,transparent);border-radius:6px;overflow:hidden;margin:14px 0 0}
.progress i{display:block;height:100%;background:var(--accent);width:0;border-radius:6px;transition:width .3s ease}
.tip{font-size:.85rem;color:var(--muted);margin:12px 0 0;text-align:center}

/* Sections */
.block{margin:28px 0 0}
.block > header{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}
.block > header h3{font-size:1.35rem}
.block > header span{font-size:.82rem;color:var(--muted)}

/* Checklists */
.steps{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.steps li+li{border-top:1px solid var(--line)}
.check{display:flex;gap:12px;align-items:center;width:100%;min-height:52px;text-align:left;background:none;border:0;padding:10px 16px}
.box{flex:none;width:22px;height:22px;border:2px solid color-mix(in srgb,var(--muted) 60%,transparent);border-radius:50%;display:grid;place-items:center;transition:background .15s,border-color .15s}
.check[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.check[aria-pressed="true"] .box::after{content:"";width:5px;height:10px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check[aria-pressed="true"] .txt{color:var(--muted)}
.check[aria-pressed="true"] .txt b{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.steps .row{display:flex;align-items:center}
.steps .row .check{flex:1}
.vplay{flex:none;width:36px;height:36px;margin-right:12px;border-radius:50%;border:0;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);color:var(--accent);font-size:.75rem;padding-left:2px}
.vplay[aria-expanded="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
.steps .slot:not(:empty){padding:0 16px 14px}
.steps .player{margin-top:0}
.txt b{font-weight:600}
.txt small{display:block;color:var(--muted);font-size:.84rem}

/* Exercise cards */
.ex{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border:1px solid transparent;transition:border-color .2s}
.ex.complete{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.ex-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.num{font-family:var(--display);font-weight:700;font-size:1rem;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.ex.complete .num{background:var(--accent);color:var(--on-accent)}
.ex h4{font-size:1.35rem}
.dose{font-size:.9rem;color:var(--muted);margin-top:2px}
.dose b{font-family:var(--display);font-size:1.05rem;font-weight:600;color:var(--ink)}
.kg{display:flex;align-items:baseline;gap:4px;font-size:.8rem;color:var(--muted)}
.kg input{width:58px;padding:8px 6px;border:1px solid color-mix(in srgb,var(--ink) 12%,transparent);border-radius:var(--r-sm);background:var(--sunk);color:var(--ink);font:600 1rem var(--body);text-align:center}
.kg input:focus{outline:none;border-color:var(--accent)}
.cue{margin:12px 0 0;font-size:.92rem;color:var(--muted)}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:8px;margin-top:14px}
.set{min-height:52px;padding:8px 6px;border-radius:var(--r-sm);border:0;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--display);font-size:1.1rem;font-weight:600;line-height:1;transition:background .15s,transform .1s}
.set:active{transform:scale(.96)}
.set small{display:block;font-family:var(--body);font-size:.7rem;font-weight:500;color:var(--muted);margin-top:4px}
.set[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
.set[aria-pressed="true"] small{color:inherit;opacity:.8}
.more{margin-top:12px}
.more summary{list-style:none;cursor:pointer;font-size:.85rem;color:var(--muted);font-weight:500;padding:4px 0}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"▸";display:inline-block;margin-right:6px;transition:transform .15s}
.more[open] summary::before{transform:rotate(90deg)}
.gear{margin:8px 0 0;font-size:.86rem;color:var(--muted);display:grid;gap:2px}
.gear b{color:var(--ink);font-weight:600}
.watch{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:6px;border:0;background:var(--sunk);border-radius:var(--r-sm);text-align:left}
.watch img{width:88px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;flex:none;background:var(--line)}
.watch .play{font-weight:600;font-size:.92rem}
.watch small{display:block;color:var(--muted);font-size:.8rem}
.player{margin-top:10px;aspect-ratio:16/9;border-radius:var(--r-sm);overflow:hidden;background:#000}
.player iframe{width:100%;height:100%;border:0;display:block}

.finish{display:block;width:100%;margin:24px 0 0;padding:16px;border:0;border-radius:var(--r);background:var(--accent);color:var(--on-accent);font-family:var(--display);font-size:1.25rem;font-weight:700;letter-spacing:.02em}
.rest-day{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-top:8px}
.rest-day p{margin:0 0 6px}
.rest-day p:last-child{margin:0}

/* Rest timer */
.timer{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:25;transform:translateY(calc(100% + 120px));visibility:hidden;transition:transform .25s ease,visibility .25s;pointer-events:none}
.timer.on{transform:none;visibility:visible;pointer-events:auto}
.tbox{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:10px 10px 10px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25);position:relative;overflow:hidden}
.tbox .fill{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0}
.tbox .clock{font-family:var(--display);font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:4ch}
.tbox .lbl{flex:1;font-size:.86rem;line-height:1.25}
.tbox button{background:color-mix(in srgb,var(--bg) 14%,transparent);border:0;color:var(--bg);border-radius:999px;padding:8px 12px;font-size:.85rem;font-weight:600}
.tbox.go{background:var(--accent);color:var(--on-accent)}

/* Eat */
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:16px;padding:14px 8px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.mac{padding:0 8px;text-align:left}
.mac + .mac{border-left:1px solid var(--line)}
.mac .t{font-size:.68rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.mac .v{font-family:var(--display);font-size:1.35rem;font-weight:700;line-height:1;white-space:nowrap}
.mac .v small{font-size:.75rem;font-weight:500;color:var(--muted);margin-left:1px}
.mac .progress{margin:8px 0 0;height:4px}
.meals{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.mcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.mcard .check{padding:14px 16px 6px;align-items:flex-start}
.mcard .check .box{margin-top:2px}
.mcard .txt{flex:1}
.mcard h4{font-size:1.2rem;display:flex;justify-content:space-between;gap:8px}
.mcard h4 time{font-family:var(--body);font-size:.8rem;font-weight:500;color:var(--muted);letter-spacing:0}
.mcard .tag{display:block;font-family:var(--body);font-size:.72rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.mcard ul{margin:0;padding:0 16px 12px 50px;font-size:.9rem;color:var(--ink)}
.mcard li{margin:2px 0}
.mcard .mm{display:flex;gap:14px;padding:10px 16px 12px 50px;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line)}
.mcard .mm b{color:var(--ink);font-weight:600}

/* Shop */
.shop h3{font-size:1.2rem;margin:24px 2px 8px}
.shop .steps .txt{display:flex;justify-content:space-between;gap:12px;width:100%}
.shop .qty{font-size:.88rem;color:var(--muted);white-space:nowrap}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.85rem;color:var(--muted);margin-top:12px}

[hidden]{display:none!important}
@media (min-width:560px){.plate{width:42px;height:42px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <div class="brand"><h1>Recomp · Phase 1</h1><span>70 → 75 kg</span></div>
    <div class="week" id="week" role="group" aria-label="Choose a day"></div>
  </div>
</div>

<main class="wrap">
  <section id="view-train" aria-live="polite"></section>
  <section id="view-eat" hidden></section>
  <section id="view-shop" class="shop" hidden></section>
</main>

<div class="timer" id="timer" role="timer" aria-live="assertive">
  <div class="wrap">
    <div class="tbox" id="tbox">
      <div class="clock" id="tclock">0:00</div>
      <div class="lbl" id="tlabel">Rest</div>
      <button id="tplus" type="button">+15s</button>
      <button id="tskip" type="button">Skip</button>
      <div class="fill" id="tfill"></div>
    </div>
  </div>
</div>

<nav class="tabbar" role="tablist" aria-label="Sections">
  <div class="wrap">
    <button class="tab" role="tab" data-tab="train" aria-selected="true">Train</button>
    <button class="tab" role="tab" data-tab="eat" aria-selected="false">Eat</button>
    <button class="tab" role="tab" data-tab="shop" aria-selected="false">Shop</button>
  </div>
</nav>

<script>
/* ---------- Data ---------- */
const V = (id, channel, len) => ({id, channel, len});
const EX = {
  backsquat:{name:"Back squat",sets:4,reps:"5–8",rest:120,cue:"Brace hard, sit between your hips, drive up through the whole foot.",
    gear:"Squat rack + barbell",swap:"Leg press or goblet squat",video:V("aOzrA4FgnM0","Max Euceda","2:01")},
  bench:{name:"Bench press",sets:4,reps:"5–8",rest:120,cue:"Shoulder blades pinned, controlled lowering, touch low on the chest.",
    gear:"Flat bench + barbell rack",swap:"Flat dumbbell press",video:V("lWFknlOTbyM","Max Euceda","2:00")},
  pullup:{name:"Assisted pull-ups",sets:4,reps:"5–8",rest:105,cue:"Full hang, chest to bar. Less assistance each week.",
    gear:"Assisted pull-up machine",swap:"Band-assisted pull-ups or lat pulldown",video:V("wFj808u2HWU","PureGym","1:12")},
  hammer:{name:"Hammer curls",sets:3,reps:"10–12",rest:60,cue:"Elbows pinned, slow lowering, no swinging.",
    gear:"Dumbbells",swap:"Cable rope hammer curl",video:V("BRVDS6HVR9Q","Buff Dudes","1:30")},
  hlr:{name:"Hanging leg raises",bw:true,sets:3,reps:"max",rest:60,cue:"No swinging. Curl the pelvis up at the top.",
    gear:"Pull-up bar or captain's chair",swap:"Captain's chair knee raises",video:V("2n4UqRIJyk4","Gerardi Performance","0:16")},

  rdl:{name:"Romanian deadlifts",sets:3,reps:"8–10",rest:120,cue:"Soft knees, hips back, bar close to the thighs. Stop at the hamstring stretch.",
    gear:"Barbell or dumbbells",swap:"Dumbbell RDL",video:V("3VXmecChYYM","Max Euceda","2:00")},
  incline:{name:"Incline dumbbell press",sets:4,reps:"8–12",rest:90,cue:"Bench at 30°. Deep stretch at the bottom, press up and slightly in.",
    gear:"Adjustable bench + dumbbells",swap:"Incline chest press machine",video:V("IP4oeKh1Sd4","Max Euceda","2:00")},
  pulldown:{name:"Lat pulldowns",sets:4,reps:"10–12",rest:90,cue:"Chest up, elbows to your sides, full stretch at the top.",
    gear:"Lat pulldown machine",swap:"Assisted pull-ups",video:V("43hWj8mfYGY","Max Euceda","2:00")},
  pushdown:{name:"Triceps pushdowns",sets:3,reps:"10–12",rest:60,cue:"Elbows at your sides, full lockout.",
    gear:"Cable stack + rope or bar",swap:"Overhead dumbbell extension",video:V("-zLyUAo1gMw","Max Euceda","2:00")},
  crunch:{name:"Cable crunches",sets:3,reps:"12–15",rest:60,cue:"Hips still, curl ribs toward pelvis, pause at the bottom.",
    gear:"Cable stack + rope",swap:"Ab crunch machine",video:V("3qjoXDTuyOE","Bodybuilding.com","0:50")},

  bss:{name:"Bulgarian split squats",sets:3,reps:"10–12 /leg",rest:90,cue:"Rear foot on the bench, front heel stays down.",
    gear:"Bench + dumbbells",swap:"Reverse lunges",video:V("SkNsa3eBwLA","Max Euceda","2:00")},
  pushup:{name:"Push-ups",bw:true,sets:4,reps:"max",rest:75,cue:"Body in one line, chest to the floor. Stop when the hips sag.",
    gear:"Floor",swap:"Feet on a bench to make it harder, knees down to make it easier",video:V("F0mFvxZelaE","Max Euceda","2:00")},
  pullmax:{name:"Assisted pull-ups",sets:3,reps:"max",rest:75,cue:"Same assistance as Monday. Stop when you can't reach chest to bar.",
    gear:"Assisted pull-up machine",swap:"Lat pulldown, 15–20 reps",video:V("wFj808u2HWU","PureGym","1:12")},
  ohp:{name:"Seated dumbbell press",sets:3,reps:"12–15",rest:60,cue:"Back supported. Lower to ear height, ribs down.",
    gear:"Upright bench + dumbbells",swap:"Shoulder press machine",video:V("rO_iEImwHyo","Max Euceda","2:00")},
  farmer:{name:"Farmer's walks",sets:4,time:45,rest:60,cue:"Heaviest dumbbells you can hold. Tall posture, short quick steps.",
    gear:"Heavy dumbbells or trap bar",swap:"Static dumbbell holds",video:V("NH7Xv-7NQNQ","Buff Dudes","1:30")},

  zone2:{name:"Zone 2 cardio",sets:1,time:2400,rest:0,cue:"Easy, steady pace: 60–70% of max heart rate. Breathe through your nose and keep it easy enough to talk in full sentences.",
    gear:"Bike, rower or incline treadmill",swap:"Outdoor ride or brisk hill walk"},
};

/* Warm-ups prime the day's main lifts; cool-downs stretch what was just trained.
   One movement per step; third item = short demo video. */
const WV = {
  wgs:V("-CiWQ2IvY34","Squat University","0:43"),
  squat:V("P-yaD24bUE8","Runna","0:47"),
  pullapart:V("bYsgk9SrJ48","Hinge Health","1:12"),
  bridge:V("L9KZfxT654Y","Runna","0:26"),
  goodmorning:V("61zbhuRiwQg","Horton Barbell","0:54"),
  lunge:V("mAgbXQdd4LM","PureGym","0:15"),
  scappu:V("m1x3Q4ALX3o","Rod J Cooper","0:54"),
};
const WARM_HEAVY = [
  ["Bike","5 min, easy"],
  ["World's greatest stretch","3 per side",WV.wgs],
  ["Bodyweight squats","10 reps",WV.squat],
  ["Band pull-aparts","15 reps",WV.pullapart],
  ["Ramp-up sets","Squat + bench: bar × 10, 50% × 5, 70% × 3"],
];
const COOL_HEAVY = [
  ["Hip-flexor stretch","45s per side"],
  ["Doorway chest stretch","30s per side"],
  ["Dead hang or lat stretch","30s"],
  ["Child's pose","1 min, slow breathing"],
];
const WARM_VOLUME = [
  ["Rower","5 min, easy"],
  ["Glute bridges","12 reps",WV.bridge],
  ["Bodyweight good mornings","10 reps",WV.goodmorning],
  ["Band pull-aparts","15 reps",WV.pullapart],
  ["Ramp-up sets","RDL and incline press: 2 light sets of 8"],
];
const COOL_VOLUME = [
  ["Seated hamstring stretch","45s"],
  ["Doorway chest stretch","30s per side"],
  ["Overhead triceps stretch","30s per side"],
  ["Cobra stretch for the abs","30s"],
];
const WARM_ENDURANCE = [
  ["Bike","5 min, easy"],
  ["Walking lunges","10 per leg",WV.lunge],
  ["Scap push-ups","10 reps",WV.scappu],
  ["Band pull-aparts","15 reps",WV.pullapart],
  ["Ramp-up set","Split squat: 1 light set of 8 per leg"],
];
const COOL_ENDURANCE = [
  ["Couch stretch for quads and hip flexors","45s per side"],
  ["Doorway chest stretch","30s per side"],
  ["Cross-body shoulder stretch","30s per side"],
  ["Forearm stretch","30s each way"],
];

function renderWeek(){
  const el=document.getElementById("week");
  el.innerHTML=DAYS.map((d,i)=>{
    const done=S.log[dkey(i)]?.done;
    return `<button class="day" type="button" data-i="${i}" aria-pressed="${i===sel}" aria-label="${d.d}, ${d.title}${done?", completed":""}">
      <span class="plate${done?" done":""}" style="--pc:${plateVar(d.plate)}"></span>
      <small>${d.d}<br>${dateOf(i).getDate()}${i===todayIdx?'<span class="today">today</span>':""}</small></button>`}).join("");

function videoBtn(v,label){
  return `<button class="watch" type="button" data-vid="${v.id}">
    <img src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt="" loading="lazy">
    <span><span class="play">▶ ${esc(label||"Watch form video")}</span><small>${esc(v.channel)} · ${v.len}</small></span></button>`;
}
function stepsList(list,which,log){
  return `<ul class="steps">${list.map((s,i)=>`<li><div class="row"><button class="check" type="button" data-step="${which}" data-i="${i}" aria-pressed="${!!log[which][i]}">
    <span class="box"></span><span class="txt"><b>${esc(s[0])}</b><small>${esc(s[1])}</small></span></button>${s[2]?`<button class="vplay" type="button" data-vid="${s[2].id}" aria-label="Watch ${esc(s[0])} demo (${s[2].len})">▶</button>`:""}</div><div class="slot"></div></li>`).join("")}</ul>`;
}
function counts(i){
  const d=DAYS[i], L=dayLog(i); let tot=0,done=0;
  d.ex.forEach(id=>{const e=EX[id];tot+=e.sets;done+=(L.sets[id]||[]).filter(Boolean).length});
  tot+=d.warm.length+d.cool.length; done+=L.warm.filter(Boolean).length+L.cool.filter(Boolean).length;
  return {tot,done};
}

function exCard(id,n,L){
  const e=EX[id], done=L.sets[id]||[];
  const complete=done.filter(Boolean).length===e.sets;
  const dose=e.time?(e.time>=600?`${e.time/60} min`:`${e.sets} × ${e.time}s`):`${e.sets} × ${e.reps}`;
  const sets=Array.from({length:e.sets},(_,i)=>`<button class="set" type="button" data-id="${id}" data-i="${i}" aria-pressed="${!!done[i]}">
    ${e.time?(e.time>=600?"Start":fmt(e.time)):(e.reps==="max"?"Max":e.reps.replace(" /leg",""))}<small>${e.time?"timer":"set "+(i+1)}</small></button>`).join("");
  return `<article class="ex${complete?" complete":""}" id="ex-${id}">
    <div class="ex-head"><span class="num">${n+1}</span><div>
      <h4>${esc(e.name)}</h4>
      <div class="dose"><b>${dose}</b>${e.rest?` · rest ${fmt(e.rest)}`:""}</div>
    </div>${e.bw||e.time&&e.time>=600?"":`<label class="kg"><input inputmode="decimal" data-id="${id}" value="${esc(S.kg[id]||"")}" placeholder="–" aria-label="Weight used in kg">kg</label>`}</div>
    <p class="cue">${esc(e.cue)}</p>
    <div class="sets" role="group" aria-label="Sets">${sets}</div>
    <details class="more"><summary>${e.video?"Form video &amp; alternatives":"Alternatives"}</summary>
      <div class="gear"><span><b>Equipment:</b> ${esc(e.gear)}</span><span><b>Machine taken?</b> ${esc(e.swap)}</span></div>
      ${e.video?`${videoBtn(e.video)}<div class="slot"></div>`:""}
    </details>
  </article>`;
}

function onSet(b,L){
  const id=b.dataset.id,i=+b.dataset.i,e=EX[id];
  const arr=(L.sets[id]??=[]);
  if(arr[i]){arr[i]=false;b.setAttribute("aria-pressed","false");save();refreshProgress();return}
  unlockAudio();
  if(e.time){
    startTimer(e.time,`${e.name}${e.sets>1?` · set ${i+1}/${e.sets}`:""}`,"work",()=>{
      arr[i]=true;save();renderTrainKeepScroll();
      if(e.rest&&arr.filter(Boolean).length<e.sets) startTimer(e.rest,`Rest · then set ${i+2} of ${e.name}`,"rest");
    });
    return;
  }
  arr[i]=true;b.setAttribute("aria-pressed","true");save();refreshProgress();
  const left=e.sets-arr.filter(Boolean).length;
  const d=DAYS[sel],nextId=d.ex[d.ex.indexOf(id)+1];
  const label=left>0?`Rest · ${left} set${left>1?"s":""} of ${e.name} left`:(nextId?`Rest · next up: ${EX[nextId].name}`:"Done — head to the cool-down");
  if(left===0) b.closest(".ex").classList.add("complete");
  startTimer(left>0||nextId?e.rest:0,label,"rest");
}
function renderTrainKeepScroll(){const y=scrollY;renderTrain();scrollTo(0,y)}
function refreshProgress(){
  const c=counts(sel),p=c.done/c.tot*100;
  const pct=document.getElementById("pct"),bar=document.getElementById("pbar");
  if(pct)pct.textContent=Math.round(p)+"%"; if(bar)bar.style.width=p+"%";
}
function nextSession(){
  for(let k=1;k<=7;k++){const i=(sel+k)%7,d=DAYS[i]; if(!d.rest) return `<div class="rest-day"><p><b>${d.d}: ${d.title} — ${d.sub}</b></p><p class="muted">${d.ex.map(id=>EX[id].name).join(", ")}</p></div>`}
  return "";
}
function wireVideos(root){
  root.querySelectorAll(".watch,.vplay").forEach(b=>b.onclick=()=>{
    const slot=b.classList.contains("vplay")?b.closest("li").querySelector(".slot"):b.nextElementSibling;
    const open=slot.innerHTML!=="";
    root.querySelectorAll(".slot").forEach(s=>s.innerHTML="");
    root.querySelectorAll(".vplay").forEach(v=>v.setAttribute("aria-expanded","false"));
    if(open) return;
    if(b.classList.contains("vplay")) b.setAttribute("aria-expanded","true");
    slot.innerHTML=`<div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${b.dataset.vid}?autoplay=1&rel=0&modestbranding=1&playsinline=1" title="Exercise video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>`;
  });
}

/* ---------- Timer ---------- */
let T=null, actx=null;
const tEl=document.getElementById("timer"),tbox=document.getElementById("tbox");
function unlockAudio(){try{actx??=new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}}
function beep(){
  try{navigator.vibrate?.([200,100,200])}catch(e){}
  if(!actx) return;
  [0,.25,.5].forEach((t,k)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=k===2?1320:880;
    g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.3,actx.currentTime+t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.2);o.connect(g).connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.22)});
}
function startTimer(sec,label,kind,onDone){
  stopTimer(true);
  if(!sec){return}
  T={end:Date.now()+sec*1000,total:sec,label,kind,onDone};
  tbox.classList.toggle("go",kind==="work");
  document.getElementById("tlabel").textContent=(kind==="work"?"Go · ":"")+label;
  tEl.classList.add("on"); tick(); T.iv=setInterval(tick,250);
}
function tick(){
  if(!T) return; const left=(T.end-Date.now())/1000;
  document.getElementById("tclock").textContent=fmt(left);
  document.getElementById("tfill").style.width=(100-left/T.total*100)+"%";
  if(left<=0){const cb=T.onDone;clearInterval(T.iv);beep();
    if(T.kind==="rest"){document.getElementById("tlabel").textContent="Rest over — next set";tbox.classList.add("go");T.iv=null;setTimeout(()=>{if(T&&!T.iv)stopTimer()},6000)}
    else{T=null;tEl.classList.remove("on")}
    cb&&cb();}
}
function stopTimer(silent){if(T){clearInterval(T.iv);T=null} if(!silent)tEl.classList.remove("on")}
document.getElementById("tplus").onclick=()=>{if(T){T.end+=15000;T.total+=15;if(!T.iv){T.iv=setInterval(tick,250);tbox.classList.toggle("go",T.kind==="work")}}};
document.getElementById("tskip").onclick=()=>{if(T&&T.kind==="work"){T.end=Date.now();tick()}else stopTimer()};

    <button class="ghost" type="button" id="clearShop">Clear ticks</button></div>
  ${SHOP.map(([cat,items])=>`<h3>${cat}</h3><ul class="steps">${items.map(([n,q])=>`<li><button class="check" type="button" data-s="${esc(n)}" aria-pressed="${!!got[n]}"><span class="box"></span><span class="txt"><b>${esc(n)}</b><span class="qty">${q}</span></span></button></li>`).join("")}</ul>`).join("")}`;
  el.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{got[b.dataset.s]=!got[b.dataset.s];save();renderShop()});
  document.getElementById("clearShop").onclick=()=>{S.shop[weekKey]={};save();renderShop()};
}

/* ---------- Tabs ---------- */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{tab=t.dataset.tab;renderAll();window.scrollTo({top:0})});
function renderAll(){
  renderWeek();
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===tab));
  ["train","eat","shop"].forEach(v=>document.getElementById("view-"+v).hidden=v!==tab);
  document.getElementById("week").style.display=tab==="shop"?"none":"";
  if(tab==="train")renderTrain(); if(tab==="eat")renderEat(); if(tab==="shop")renderShop();
}
renderAll();
</script>
</body>
</html>
